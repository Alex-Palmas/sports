name: Update data & deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fetch_odds:
        description: "Spend The Odds API credits on this run"
        type: boolean
        default: false
  workflow_run:              # publish new latency-study recordings as soon as they're committed
    workflows: ["Kalshi latency study", "Kalshi crypto bot (paper)"]
    types: [completed]
  schedule:
    - cron: "17 */3 * * *"   # refresh ESPN stats & schedule every 3 hours
    - cron: "41 15 * * *"    # daily (~10:41 ET): also refresh sportsbook lines

permissions:
  contents: write   # publishes the live model ledger to the model-ledger branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Odds are fetched at most once a day (free tier = 500 credits/month) and cached between runs.
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: odds-${{ github.run_id }}
          restore-keys: odds-

      - name: Test parsers
        run: node --test

      # The live model ledger (graded model-vs-market picks) lives on the model-ledger branch so it
      # survives cache eviction and the daily tuning session can read it.
      - name: Restore model ledger
        run: |
          mkdir -p .cache
          if git fetch -q origin model-ledger 2>/dev/null; then git show origin/model-ledger:track.json > .cache/track.json && echo "ledger restored"; fi

      - name: Fetch real player data
        continue-on-error: true   # if ESPN is down, still deploy (the app falls back to demo data)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FETCH_ODDS: ${{ github.event.schedule == '41 15 * * *' || inputs.fetch_odds == true }}
          ODDS_MAX_CREDITS: ${{ vars.ODDS_MAX_CREDITS || '16' }}
          ODDS_REGIONS: ${{ vars.ODDS_REGIONS || 'us' }}
        run: node scripts/fetch-data.mjs

      - name: Publish model ledger
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -s .cache/track.json ] || exit 0
          tmp=$(mktemp -d); cp .cache/track.json "$tmp/"
          cd "$tmp" && git init -q -b model-ledger && git add track.json \
            && git -c user.name="github-actions[bot]" -c user.email="41898341+github-actions[bot]@users.noreply.github.com" commit -qm "Model ledger $(date -u +%FT%TZ)" \
            && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" model-ledger

      - name: Backtest the edge model
        continue-on-error: true
        run: node scripts/backtest-model.mjs

      - uses: actions/cache/save@v4
        if: always() && hashFiles('.cache/**') != ''
        with:
          path: .cache
          key: odds-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
